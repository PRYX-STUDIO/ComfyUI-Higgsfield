[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pryx-comfyui-higgsfield"
version = "1.0.2"
description = "Generate and edit images and videos with Higgsfield from ComfyUI, using model-specific controls, connected media references, and estimate-first cost checks."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "PRYX Studio" }]
dependencies = [
  "higgsfield-client>=0.2.0,<0.3.0",
  "httpx>=0.21.0,<0.29.0",
  "jsonschema>=4.20,<5",
]

[project.urls]
Homepage = "https://github.com/PRYX-STUDIO/pryx-comfyui-higgsfield"
Repository = "https://github.com/PRYX-STUDIO/pryx-comfyui-higgsfield"
Documentation = "https://github.com/PRYX-STUDIO/pryx-comfyui-higgsfield#readme"

[tool.comfy]
PublisherId = "pryx-studio"
DisplayName = "PRYX ComfyUI Higgsfield"
Icon = "https://raw.githubusercontent.com/PRYX-STUDIO/pryx-comfyui-higgsfield/main/assets/registry-icon.png"
Banner = "https://raw.githubusercontent.com/PRYX-STUDIO/pryx-comfyui-higgsfield/main/assets/registry-banner.jpg"
RequiresComfyUI = ">=0.35.0"
FrontendVersion = ">=1.53.6"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["pryx_comfyui_higgsfield*"]
namespaces = false

[tool.setuptools.package-data]
pryx_comfyui_higgsfield = ["catalog/*.json", "web/js/*.js"]
